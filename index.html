    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    border-radius: 10px; outline: none; cursor: pointer;
    box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07), 0 0 80px rgba(255,214,120,.10);

  body.mobile-fill {

  }

    display: none; position: fixed; inset: 0; z-index: 10000;
    background: #0a0b18; color: #fff8e8;

    gap: 18px; padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);

<script>
'use strict';
/*
 * 萬安心驚驚 — a top-down flashlight maze chase, sibling of 萬安衝衝衝 / 萬安大砲.
 * Same engine bits: ASCII sprite compiler, chibi sprite kit, crisp vector CJK text. No sound at all:
 * every cue is visual (banners, bubbles, '!' marks, red vignette, edge arrows, shakes, particles).
 *
 *   1. Config          5. Maze generation + tile art     8. Game (AI, events, sequences)
 *   2. Utilities       6. Particles                      9. Rendering (light, HUD, title, card)
 *   3. Pixel art/text  7. Input                         10. Boot
 *   4. Sprites
 *
 * Satire is kept to publicly reported talking points and stays lighthearted: nobody gets hurt,
 * chasers are only ever stunned (dizzy, arguing), and 萬安 only ever loses an election.
 */
(() => {

// ───────────────────────────── 1. CONFIG ─────────────────────────────
const BASE_VIEW_W = 400;
const BASE_VIEW_H = 224;
let VIEW_W = BASE_VIEW_W;
let VIEW_H = BASE_VIEW_H;
const TILE = 20;
const HUD_H = 18;
const FEET = 5;                       // sprites stand this far below their ground point
const T_FLOOR = 0, T_WALL = 1, T_TREE = 2, T_UMB = 3;
const solidT = (t) => t === T_WALL || t === T_TREE;

const PLAYER = { SPEED: 66, LIVES: 3, INVULN: 2.4, HW: 5, HH: 4, SLOW_TIME: 1.7, SLOW: 0.42 };
/** Unlit areas stay readable: a ~50% blue-tinted veil, never black. The flashlight punches it out fully. */
const LIGHT = { DARK: 0.5, TINT: '16,20,54', HALF: 0.52, RANGE: 148, AURA: 36, DRAIN: 1.35, RAYS: 72, FADE: 5, SIL_DIST: 5 * TILE, SIL_A: 0.16 };
const SIGHT = { NEAR: 5.5 * TILE, LIT: 9 * TILE, FORGET: 3.4, BOSS_FORGET: 2.6 };
// End card timeline (seconds since it opened). Input stays locked until LOCK.
const CARD = { IN: 0.35, ROW0: 0.4, ROW_DT: 0.13, STAMP: 1.6, SLAM: 0.12, LOCK: 2.0 };
const STORAGE_HI = 'wanan.maze.hi';
// Boss phase (Galaga-style dodge after clearing maze level 3). No sound — visual cues only.
const BOSS_HP = 160;
const BOSS = { REVIVE_AT: 0.08, REVIVE_TIME: 2.1, MAX_SPEEDUP: 1.35 };
const STAGE_NAMES = ['', '', '認真模式', '翻盤模式', '暴走模式', '海嘯模式'];
const stageName = (n) => STAGE_NAMES[n] || `無限模式 ${n - 4}`;
const SURVIVE = { NEED: 50, FIRE: 0.22, SPEED: 145, ACCEL: 1300, BULLET: 240, INVULN: 2.0, BASE_Y: 208 };
const ENDERS = ['lu', 'han', 'zheng'];   // 盧秀燕 / 韓國瑜 / 鄭麗文 — ending only
const ENDER_NAMES = { lu: '盧媽媽', han: '韓國瑜', zheng: '鄭麗文' };
const ENDER_LINE = '上當了吧！繼續當你的台北市長，2028是我的！';
/** Maze 洋流 hazard: warn → rush along path toward 萬安. Faster than chasers; squid/berry only briefly slow it. */
const CURRENT = { WARN: 1.15, LIFE: 5.2, SPEED: 81, SLOW: 0.45, SLOW_T: 0.9, HIT: 11, INTERVAL: [16, 24], INTERVAL_LV: 1.6 };
/** Player-chopped street trees: hold Space ~2.4s while adjacent & facing. */
const TREE = { MAX_HP: 2.4, RANGE: 1 };

/** Live touch-copy switch: coarse pointer, mobile-fill layout, or first touch/pen. */
function wantTouchPrompt() {
  try {
    const g = (typeof wananMaze !== 'undefined' && wananMaze.game) || (typeof game !== 'undefined' ? game : null);
    if (g && g.input && g.input.touchUI) return true;
  } catch (_) {}
  if (typeof document !== 'undefined' && document.body && document.body.classList.contains('mobile-fill')) return true;
  try { if (matchMedia('(pointer: coarse)').matches) return true; } catch (_) {}
  return false;
}
/** Title/help/end: desktop = 按[空白鍵]… ; touch = 點一下… (no keycap). */
function drawActionPrompt(ctx, action, cx, y, color, alpha = 1, pressed = false, backing = false) {
  if (wantTouchPrompt()) {
    const label = action === '再戰連任' ? '點一下重來' : `點一下${action}`;
    const w = zhWidth(label, 12, 'bold') + 14;
    if (backing) drawBacking(ctx, cx, y - 6, w, 24, 0.55 * alpha);
    const blink = pressed ? 0.55 + 0.45 * alpha : alpha;
    drawZh(ctx, label, cx, y, { size: 12, weight: 'bold', align: 'center', color, alpha: blink, outline: (color === '#2a2433' || color === PAL.ink) ? null : '#2a2433' });
    return;
  }
  drawPrompt(ctx, '按', '空白鍵', action, cx, y, color, alpha, pressed, backing);
}

const NAMES = { player: '蔣萬安', boss: '沈伯洋', jian: '簡舒培', he: '何孟樺', xu: '許淑華' };
const BUBBLE_TEXT = '來辯論阿';
// 議員質詢 lines (市長自己回答！ is the most common). 「來辯論阿」 is reserved for 沈伯洋.
const LINES = {
  jian: ['市長自己回答！', '市長自己回答！', '我要質詢！', '請市長答詢！', '市長別跑！'],
  he:   ['市長自己回答！', '市長自己回答！', '我要質詢！', '市長別跑！'],
  xu:   ['市長自己回答！', '市長自己回答！', '市長自己回答！', '請市長答詢！', '我要質詢！'],
  boss: ['來辯論阿！', '讓我們回歸市政 哇哈哈哈', '市長不敢辯論喔？', '來辯論阿！哇哈哈哈'],
};
// 萬安's own reaction when spotted (chasers never say 糟糕). Councillors → 質詢 panic; 沈伯洋 → 辯論 panic.
const PANIC = {
  CD: 6, DUR: 2.2, COLOR: '#24407e',
  council: ['糟糕，又要首長救駕了', '糟糕，又要首長救駕了', '糟糕，我答不出來'],
  boss: ['糟糕，我不敢辯論', '糟糕，我不敢辯論', '糟糕，我不敢辯論'],
};
const CHASER_ORDER = ['jian', 'he', 'xu'];
const LEVELS = [
  { place: '市府路巷弄', theme: 'alley' }, { place: '議會走廊', theme: 'council' }, { place: '萬華老街', theme: 'old' },
  { place: '信義暗巷', theme: 'alley' }, { place: '議會地下室', theme: 'council' }, { place: '大稻埕騎樓', theme: 'old' },
  { place: '北投坡道', theme: 'alley' }, { place: '南港舊廠區', theme: 'alley' },
];
const levelInfo = (n) => LEVELS[(n - 1) % LEVELS.length];

const PAL = { ink: '#2a2433', star: '#ffd84a', gold: '#f2a93b', cream: '#fff7e6' };

// ──────────────────────────── 2. UTILITIES ────────────────────────────
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const smoothstep = (t) => t * t * (3 - 2 * t);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
const pad5 = (n) => String(Math.floor(n)).padStart(5, '0');

function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const mixRgb = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
/** Three-key blend: day → dusk (t = .5) → night (t = 1). */
const tri = (day, dusk, night, t) => (t < 0.5 ? mixRgb(day, dusk, t * 2) : mixRgb(dusk, night, (t - 0.5) * 2));

let PX = 1;                                     // device pixels per logical pixel (integer)
const snap = (v) => Math.round(v * PX) / PX;    // snap to the device-pixel grid

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}


const shuffle = (a, r = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hash2 = (x, y, s) => { let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; };
const angDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
// ──────────────────────────── 3. PIXEL ART ────────────────────────────
/** Compile an ASCII sprite: auto 1px ink outline + interior-only collision mask. */
function makeSprite(rows, palette, outline = PAL.ink) {
  const pad = outline ? 1 : 0;
  const w0 = Math.max(...rows.map((r) => r.length)), h0 = rows.length;
  const w = w0 + pad * 2, h = h0 + pad * 2;
  const [canvas, g] = makeCanvas(w, h);
  const mask = new Uint8Array(w * h);
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch !== ' ' && palette[ch]) mask[(y + pad) * w + x + pad] = 1;
  }));
  if (outline) {
    g.fillStyle = outline;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (mask[y * w + x]) continue;
      const n = (xx, yy) => xx >= 0 && yy >= 0 && xx < w && yy < h && mask[yy * w + xx];
      if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1)) g.fillRect(x, y, 1, 1);
    }
  }
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === ' ' || !palette[ch]) return;
    g.fillStyle = palette[ch];
    g.fillRect(x + pad, y + pad, 1, 1);
  }));
  return { canvas, w, h, mask };
}
const mirror = (rows) => { const w = Math.max(...rows.map((r) => r.length)); return rows.map((r) => [...r.padEnd(w)].reverse().join('')); };

function spritesOverlap(a, ax, ay, b, bx, by) {
  const x0 = Math.max(ax, bx), x1 = Math.min(ax + a.w, bx + b.w);
  const y0 = Math.max(ay, by), y1 = Math.min(ay + a.h, by + b.h);
  if (x0 >= x1 || y0 >= y1) return false;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    if (a.mask[(y - ay) * a.w + (x - ax)] && b.mask[(y - by) * b.w + (x - bx)]) return true;
  }
  return false;
}

// ── Text: every string becomes a 1-bit "layout" of horizontal runs (fill + outline) ──
function runsFromGrid(grid, gw, gh) {
  const fill = [], out = [];
  const push = (runs, x, y) => {
    const last = runs[runs.length - 1];
    if (last && last[1] === y && last[0] + last[2] === x) last[2]++; else runs.push([x, y, 1]);
  };
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    if (grid[y * gw + x]) { push(fill, x, y); continue; }
    let near = false;
    for (let dy = -1; dy <= 1 && !near; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx < gw && yy < gh && grid[yy * gw + xx]) { near = true; break; }
    }
    if (near) push(out, x, y);
  }
  return { fill, out };
}

/** 5×7 Latin bitmap font (digits, HUD). */
const GLYPHS = (() => {
  const src = {
    A: '0e11111f111111', B: '1e11111e11111e', C: '0e11101010110e', D: '1c12111111121c',
    E: '1f10101e10101f', F: '1f10101e101010', G: '0e11101711110f', H: '1111111f111111',
    I: '0e04040404040e', J: '0702020202120c', K: '11121418141211', L: '1010101010101f',
    M: '111b1515111111', N: '11111915131111', O: '0e11111111110e', P: '1e11111e101010',
    Q: '0e11111115120d', R: '1e11111e141211', S: '0f10100e01011e', T: '1f040404040404',
    U: '1111111111110e', V: '11111111110a04', W: '1111111515150a', X: '11110a040a1111',
    Y: '1111110a040404', Z: '1f01020408101f',
    0: '0e11131519110e', 1: '040c040404040e', 2: '0e11010204081f', 3: '1f02040201110e',
    4: '02060a121f0202', 5: '1f101e0101110e', 6: '0608101e11110e', 7: '1f010204080808',
    8: '0e11110e11110e', 9: '0e11110f01020c',
    ' ': '00000000000000', '-': '0000000e000000', ':': '000c0c000c0c00', '!': '04040404040004',
    '.': '00000000000c0c', '/': '00010204081000', '+': '0004041f040400', "'": '04040800000000',
  };
  const out = {};
  for (const k in src) out[k] = Array.from({ length: 7 }, (_, i) => parseInt(src[k].substr(i * 2, 2), 16));
  return out;
})();

const layouts = new Map();
function cached(key, make) {
  let L = layouts.get(key);
  if (!L) { if (layouts.size > 600) layouts.clear(); L = make(); layouts.set(key, L); }
  return L;
}

function layoutLatin(str) {
  return cached('L' + str, () => {
    const chars = [...str.toUpperCase()];
    const w = Math.max(0, chars.length * 6 - 1), h = 7, gw = w + 2, gh = h + 2;
    const grid = new Uint8Array(gw * gh);
    chars.forEach((ch, i) => {
      const g = GLYPHS[ch] || GLYPHS[' '];
      for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if (g[r] & (16 >> c)) grid[(r + 1) * gw + i * 6 + c + 1] = 1;
    });
    return { w, h, ...runsFromGrid(grid, gw, gh) };
  });
}

const CJK_FONT = '"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC","Source Han Sans TC",sans-serif';
/**
 * Chinese text is drawn as real vector glyphs at *device* resolution (fillText under the PX
 * transform), so it stays crisp and legible at every scale. Thresholding 12px glyphs to 1-bit
 * merged strokes (王 read as 干), so the raster path below is kept only for big pixel-art logos
 * and stamps where each glyph gets 16–30 logical pixels.
 */
const ZH_WEIGHT = { normal: '600', bold: '700', 900: '900' };
const zhMeasure = makeCanvas(8, 8)[1];
function layoutCJK(str, size = 12, weight = 'normal') {
  return cached(`V${size}${weight}${str}`, () => {
    const wt = ZH_WEIGHT[weight] || weight;
    zhMeasure.font = `${wt} ${size}px ${CJK_FONT}`;
    const m = zhMeasure.measureText(str), ref = zhMeasure.measureText('國');
    const asc = ref.actualBoundingBoxAscent, desc = ref.actualBoundingBoxDescent;
    return { vector: true, str, size, wt, left: m.actualBoundingBoxLeft, asc, w: Math.ceil(m.actualBoundingBoxLeft + m.actualBoundingBoxRight), h: Math.round(asc + desc) };
  });
}
/** 1-bit raster of CJK text at `size` px (big pixel logos / stamps only). */
function rasterCJK(str, size = 16, weight = 'bold') {
  return cached(`C${size}${weight}${str}`, () => {
    const W = Math.ceil(size * (str.length + 1) * 1.2) + 8, H = size * 2;
    const raster = (text) => {
      const [c, g] = makeCanvas(W, H);
      g.font = `${weight} ${size}px ${CJK_FONT}`;
      g.textBaseline = 'middle'; g.fillStyle = '#000';
      g.fillText(text, 2, H / 2);
      return g.getImageData(0, 0, W, H).data;
    };
    const thr = weight === 'normal' ? 100 : 128;
    const ref = raster('國'), data = raster(str);
    let top = H, bottom = -1, left = W, right = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (ref[(y * W + x) * 4 + 3] >= thr) { top = Math.min(top, y); bottom = Math.max(bottom, y); }
      if (data[(y * W + x) * 4 + 3] >= thr) { left = Math.min(left, x); right = Math.max(right, x); top = Math.min(top, y); bottom = Math.max(bottom, y); }
    }
    if (right < 0) return { w: 0, h: 0, fill: [], out: [] };
    const w = right - left + 1, h = bottom - top + 1, gw = w + 2, gh = h + 2;
    const grid = new Uint8Array(gw * gh);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (data[((y + top) * W + x + left) * 4 + 3] >= thr) grid[(y + 1) * gw + x + 1] = 1;
    }
    return { w, h, ...runsFromGrid(grid, gw, gh) };
  });
}

function drawLayout(ctx, L, x, y, { color = '#fff', scale = 1, align = 'left', outline = null, shadow = null, alpha = 1 } = {}) {
  if (alpha <= 0) return;
  if (align === 'center') x -= (L.w * scale) / 2; else if (align === 'right') x -= L.w * scale;
  if (L.vector) { drawVectorText(ctx, L, x, y, scale, color, outline, shadow, alpha); return; }
  const ox = snap(x) - scale, oy = snap(y) - scale;
  const paint = (runs, col, dy) => {
    ctx.fillStyle = col;
    for (const [rx, ry, len] of runs) ctx.fillRect(ox + rx * scale, oy + ry * scale + dy, len * scale, scale);
  };
  ctx.save();
  ctx.globalAlpha *= alpha;
  if (shadow) { paint(L.fill, shadow, scale); if (outline) paint(L.out, shadow, scale); }
  if (outline) paint(L.out, outline, 0);
  paint(L.fill, color, 0);
  ctx.restore();
}
/** (x, y) is the top-left of the ink box, same contract as the pixel layouts. */
function drawVectorText(ctx, L, x, y, scale, color, outline, shadow, alpha) {
  const ox = snap(x + L.left * scale), oy = snap(y + L.asc * scale);
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${L.wt} ${L.size * scale}px ${CJK_FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round'; ctx.lineWidth = 2.2 * scale;   // ≈1 logical px of outline outside the glyph
  if (shadow) {
    ctx.fillStyle = ctx.strokeStyle = shadow;
    if (outline) ctx.strokeText(L.str, ox, oy + scale);
    ctx.fillText(L.str, ox, oy + scale);
  }
  if (outline) { ctx.strokeStyle = outline; ctx.strokeText(L.str, ox, oy); }
  ctx.fillStyle = color;
  ctx.fillText(L.str, ox, oy);
  ctx.restore();
}
/** drawImage for a sprite, plus the crisp vector label some sprites carry (speech-bubble text). */
function blit(ctx, s, x, y) {
  ctx.drawImage(s.canvas, x, y);
  if (s.label) drawLayout(ctx, s.label.L, x + s.label.x, y + s.label.y, { color: s.label.color });
}
const drawText = (ctx, str, x, y, o) => drawLayout(ctx, layoutLatin(str), x, y, o);
const textWidth = (str) => layoutLatin(str).w;
const drawZh = (ctx, str, x, y, o = {}) => drawLayout(ctx, (o.pixel ? rasterCJK : layoutCJK)(str, o.size || 12, o.weight || 'normal'), x, y, o);
const zhWidth = (str, size = 12, weight = 'normal') => layoutCJK(str, size, weight).w;

function pixelRect(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x + 1, y, w - 2, h);
  ctx.fillRect(x, y + 1, w, h - 2);
}

/** Keyboard key-cap with a CJK label, e.g. [空白鍵]. `pressed` sinks it by a pixel. Returns its width. */
function drawKeyCap(ctx, label, x, y, alpha = 1, pressed = false) {
  const L = layoutCJK(label);
  const w = L.w + 8, h = L.h + 6, d = pressed ? 1 : 0;
  ctx.save();
  ctx.globalAlpha *= alpha;
  pixelRect(ctx, x, y + d, w, h - d, PAL.ink);
  pixelRect(ctx, x + 1, y + 1 + d, w - 2, h - 2 - d, '#cfc6dd');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x + 1, y + 1 + d, w - 2, h - 4 - (pressed ? 0 : 0));
  ctx.restore();
  drawLayout(ctx, L, x + 4, y + 2 + d, { color: PAL.ink, alpha });
  return w;
}

/** Soft translucent pill behind text, so it reads over a busy skyline. */
function drawBacking(ctx, cx, y, w, h, alpha = 0.55) {
  const x = Math.round(cx - w / 2);
  pixelRect(ctx, x, y, Math.round(w), h, `rgba(30,26,46,${alpha})`);
}

/** A line like 按 [空白鍵] 開始 — centred, with a key-cap in the middle. */
function drawPrompt(ctx, before, key, after, cx, y, color, alpha = 1, pressed = false, backing = false) {
  const gap = 4;
  const w1 = zhWidth(before), w2 = layoutCJK(key).w + 8, w3 = zhWidth(after);
  const total = w1 + w2 + w3 + gap * 2;
  if (backing) drawBacking(ctx, cx, y - 6, total + 14, 24, 0.55 * alpha);
  let x = Math.round(cx - total / 2);
  drawZh(ctx, before, x, y, { color, alpha });
  x += w1 + gap;
  x += drawKeyCap(ctx, key, x, y - 3, alpha, pressed) + gap;
  drawZh(ctx, after, x, y, { color, alpha });
}

/** Little sign with a name on it, pointing down at whoever it belongs to. */
function drawNameTag(ctx, text, cx, bottom, accent, icon = null) {
  const L = layoutCJK(text);
  const iw = icon ? icon.w + 1 : 0;
  const w = L.w + 6 + iw, h = L.h + 6;
  const x = snap(cx - w / 2), y = snap(bottom - h - 2);
  pixelRect(ctx, x, y, w, h, PAL.ink);
  pixelRect(ctx, x + 1, y + 1, w - 2, h - 2, '#ffffff');
  ctx.fillStyle = accent; ctx.fillRect(x + 1, y + h - 3, w - 2, 2);
  ctx.fillStyle = PAL.ink;
  const px = snap(cx);
  ctx.fillRect(px - 1, y + h, 3, 1); ctx.fillRect(px, y + h + 1, 1, 1);
  if (icon) ctx.drawImage(icon.canvas, x + 2, y + Math.round((h - icon.h) / 2) - 1);
  drawLayout(ctx, L, x + 3 + iw, y + 2, { color: PAL.ink });
}

// ─────────────────────── 5. MAZE GENERATION + TILE ART ───────────────────────
const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

/** Breadth-first distance field over walkable tiles from one or more source tiles (-1 = unreachable). */
function bfs(lv, sources) {
  const { w, h, t } = lv, dist = new Int16Array(w * h).fill(-1), q = new Int32Array(w * h);
  let head = 0, tail = 0;
  for (const i of sources) if (!solidT(t[i]) && dist[i] < 0) { dist[i] = 0; q[tail++] = i; }
  while (head < tail) {
    const i = q[head++], x = i % w, y = (i / w) | 0, d = dist[i] + 1;
    for (const [dx, dy] of DIRS4) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const j = ny * w + nx;
      if (dist[j] < 0 && !solidT(t[j])) { dist[j] = d; q[tail++] = j; }
    }
  }
  return dist;
}

/**
 * Taipei-alley maze: a recursive-backtracker maze, braided (most dead ends knocked through so there
 * are loops to escape along), a few little plazas, and street trees standing in some of the gaps.
 */
function genLevel(n, seed) {
  const rng = mulberry32(seed), ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  const cw = Math.min(13 + 2 * (n - 1), 29), ch = Math.min(9 + (n - 1), 19);
  const w = cw * 2 + 1, h = ch * 2 + 1;
  const t = new Uint8Array(w * h).fill(T_WALL);
  const I = (x, y) => y * w + x;
  const inCells = (cx, cy) => cx >= 0 && cy >= 0 && cx < cw && cy < ch;
  // 1. perfect maze
  const vis = new Uint8Array(cw * ch);
  const s0 = [ri(0, cw - 1), ri(0, ch - 1)];
  const stack = [s0]; vis[s0[1] * cw + s0[0]] = 1; t[I(s0[0] * 2 + 1, s0[1] * 2 + 1)] = T_FLOOR;
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const nb = DIRS4.filter(([dx, dy]) => inCells(cx + dx, cy + dy) && !vis[(cy + dy) * cw + cx + dx]);
    if (!nb.length) { stack.pop(); continue; }
    const [dx, dy] = nb[Math.floor(rng() * nb.length)];
    vis[(cy + dy) * cw + cx + dx] = 1;
    t[I(cx * 2 + 1 + dx, cy * 2 + 1 + dy)] = T_FLOOR;
    t[I((cx + dx) * 2 + 1, (cy + dy) * 2 + 1)] = T_FLOOR;
    stack.push([cx + dx, cy + dy]);
  }
  // 2. braid: knock most dead ends through
  for (let cy = 0; cy < ch; cy++) for (let cx = 0; cx < cw; cx++) {
    const openN = DIRS4.filter(([dx, dy]) => t[I(cx * 2 + 1 + dx, cy * 2 + 1 + dy)] === T_FLOOR).length;
    if (openN !== 1 || rng() > 0.6) continue;
    const opts = DIRS4.filter(([dx, dy]) => inCells(cx + dx, cy + dy) && t[I(cx * 2 + 1 + dx, cy * 2 + 1 + dy)] === T_WALL);
    if (opts.length) { const [dx, dy] = opts[Math.floor(rng() * opts.length)]; t[I(cx * 2 + 1 + dx, cy * 2 + 1 + dy)] = T_FLOOR; }
  }
  // 3. small plazas (3×3)
  for (let k = 0, m = Math.min(1 + (n >> 1), 4); k < m; k++) {
    const cx = ri(1, cw - 2), cy = ri(1, ch - 2);
    for (let y = cy * 2; y <= cy * 2 + 2; y++) for (let x = cx * 2; x <= cx * 2 + 2; x++) t[I(x, y)] = T_FLOOR;
  }
  // 4. street trees in some of the one-tile gaps between corridors (cutting one opens a shortcut)
  const cand = [];
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    if (t[I(x, y)] !== T_WALL) continue;
    const L = t[I(x - 1, y)] === T_FLOOR, R = t[I(x + 1, y)] === T_FLOOR, U = t[I(x, y - 1)] === T_FLOOR, D = t[I(x, y + 1)] === T_FLOOR;
    if ((L && R && !U && !D) || (U && D && !L && !R)) cand.push(I(x, y));
  }
  shuffle(cand, rng);
  cand.slice(0, Math.max(12, Math.round(cand.length * 0.24))).forEach((i) => { t[i] = T_TREE; });

  const lv = { n, w, h, t, seed, ...levelInfo(n) };
  // start in a corner; the 連任 door goes to the farthest reachable tile
  const corners = [[1, 1], [w - 2, 1], [1, h - 2], [w - 2, h - 2]];
  const [stx, sty] = corners[ri(0, 3)];
  lv.start = { x: stx, y: sty };
  lv.distStart = bfs(lv, [I(stx, sty)]);
  let best = -1, bi = 0;
  lv.distStart.forEach((d, i) => { if (d > best) { best = d; bi = i; } });
  lv.exit = { x: bi % w, y: (bi / w) | 0 };
  // floors, dead ends, junction lamps
  lv.floors = []; lv.deadEnds = [];
  const deg = (i) => { const x = i % w, y = (i / w) | 0; return DIRS4.filter(([dx, dy]) => !solidT(t[I(x + dx, y + dy)])).length; };
  for (let i = 0; i < w * h; i++) if (!solidT(t[i]) && lv.distStart[i] >= 0) { lv.floors.push(i); if (deg(i) === 1) lv.deadEnds.push(i); }
  lv.lamps = [];
  for (const i of shuffle(lv.floors.filter((i) => deg(i) >= 3), rng)) {
    const x = i % w, y = (i / w) | 0;
    if (lv.lamps.length >= lv.floors.length / 38) break;
    if (lv.lamps.every((l) => Math.abs(l.x - x) + Math.abs(l.y - y) >= 7)) lv.lamps.push({ x, y, ph: rng() * 6 });
  }
  return lv;
}

const THEMES = {
  alley: {
    floor: '#8e8da0', floor2: '#9897aa', speck: '#7f7e93', line: '#dcd6c0',
    roof: '#d3cab6', roof2: '#c2b8a2', roofHi: '#e6dfcf', edge: '#9e947e', tin: '#93a8c6', tin2: '#7f95b4',
    tints: ['#d3cab6', '#d6cfc2', '#cdd3d6', '#dccbbd', '#c9d0c0'],
    face: '#ebdfc8', face2: '#cdbd9f', eave: '#6e6578', win: '#3f5d8e', winLit: '#ffd97a', grille: '#5a5466',
  },
  council: {
    floor: '#a24e59', floor2: '#ad5964', speck: '#924450', line: '#e0b95e',
    roof: '#ddd2bd', roof2: '#cec2a8', roofHi: '#efe8da', edge: '#b39b6a', tin: '#c9b98f', tin2: '#b6a57a',
    face: '#8f5f3f', face2: '#764b30', eave: '#4e3222', win: '#efe0b0', winLit: '#fff4c8', grille: '#d0a84e',
  },
  old: {
    floor: '#b2735f', floor2: '#bc7d69', speck: '#9c6452', line: '#e8cfaa',
    roof: '#c96d4c', roof2: '#b25c40', roofHi: '#de8a66', edge: '#8a4430', tin: '#c96d4c', tin2: '#a9553a',
    face: '#e6d5b6', face2: '#cfba96', eave: '#5e3e2c', win: '#5b4a3a', winLit: '#ffcf7a', grille: '#6a5040',
  },
};

function discPx(g, cx, cy, r, colorAt) {
  for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++) {
    const d2 = x * x + y * y;
    if (d2 <= r * r + r * 0.8) { const c = colorAt(x, y); if (c) { g.fillStyle = c; g.fillRect(cx + x, cy + y, 1, 1); } }
    else if (d2 <= (r + 1) * (r + 1) + r) { g.fillStyle = PAL.ink; g.fillRect(cx + x, cy + y, 1, 1); }
  }
}

/** One 20×20 tile, painted entirely inside its own square so it can be repainted after a tree is cut. */
function drawTile(g, lv, x, y) {
  const th = THEMES[lv.theme], px = x * TILE, py = y * TILE, T = TILE;
  const at = (xx, yy) => (xx < 0 || yy < 0 || xx >= lv.w || yy >= lv.h ? T_WALL : lv.t[yy * lv.w + xx]);
  const tt = at(x, y), hs = hash2(x, y, lv.seed), r = mulberry32(hs);
  const floorBase = () => {
    g.fillStyle = th.floor; g.fillRect(px, py, T, T);
    if (lv.theme === 'old') {                                   // red-brick paving
      g.fillStyle = th.speck;
      for (let yy = 0; yy < T; yy += 4) { g.fillRect(px, py + yy, T, 1); for (let xx = ((yy >> 2) % 2) * 3; xx < T; xx += 6) g.fillRect(px + xx, py + yy, 1, 4); }
    } else if (lv.theme === 'council') {                        // carpet with a woven diamond
      g.fillStyle = th.floor2;
      for (let k = -3; k <= 3; k++) { g.fillRect(px + 10 + k, py + 10 - (3 - Math.abs(k)), 1, 1); g.fillRect(px + 10 + k, py + 10 + (3 - Math.abs(k)), 1, 1); }
    }
    for (let i = 0; i < 7; i++) { g.fillStyle = r() < 0.5 ? th.speck : th.floor2; g.fillRect(px + Math.floor(r() * T), py + Math.floor(r() * T), r() < 0.3 ? 2 : 1, 1); }
  };
  const groundShadows = () => {
    if (solidT(at(x, y - 1))) { g.fillStyle = 'rgba(28,24,48,0.30)'; g.fillRect(px, py, T, 3); g.fillStyle = 'rgba(28,24,48,0.14)'; g.fillRect(px, py + 3, T, 2); }
    if (solidT(at(x - 1, y))) { g.fillStyle = 'rgba(28,24,48,0.18)'; g.fillRect(px, py, 2, T); }
  };
  if (tt === T_FLOOR || tt === T_UMB || tt === T_TREE) {
    floorBase();
    if (tt === T_FLOOR) {
      const L = !solidT(at(x - 1, y)), R = !solidT(at(x + 1, y)), U = !solidT(at(x, y - 1)), D = !solidT(at(x, y + 1));
      if (lv.theme === 'alley') {
        if (hs % 19 === 0) {                                    // manhole cover
          discPx(g, px + 10, py + 10, 4, (dx, dy) => ((dx + dy) % 2 === 0 ? '#6f6e82' : '#7c7b90'));
        } else if (hs % 7 === 0 && L && R && !U && !D) { g.fillStyle = th.line; g.fillRect(px + 3, py + 10, 6, 1); g.fillRect(px + 13, py + 10, 5, 1); }
        else if (hs % 7 === 0 && U && D && !L && !R) { g.fillStyle = th.line; g.fillRect(px + 10, py + 3, 1, 6); g.fillRect(px + 10, py + 13, 1, 5); }
        else if (hs % 11 === 3) { g.fillStyle = '#76758a'; g.fillRect(px + 4, py + 12, 5, 1); g.fillRect(px + 8, py + 13, 4, 1); g.fillRect(px + 11, py + 14, 3, 1); }  // crack
      } else if (lv.theme === 'council') {
        g.fillStyle = th.line;                                   // gold runner borders along the walls
        if (!U) g.fillRect(px, py + 2, T, 1);
        if (!D) g.fillRect(px, py + T - 3, T, 1);
        if (!L) g.fillRect(px + 2, py, 1, T);
        if (!R) g.fillRect(px + T - 3, py, 1, T);
      }
    }
    groundShadows();
    if (tt === T_TREE) {                                         // street tree: planter + leafy canopy
      g.fillStyle = 'rgba(24,40,24,0.35)'; g.fillRect(px + 3, py + 13, 16, 5);
      g.fillStyle = '#8d7b64'; g.fillRect(px + 6, py + 14, 9, 4); g.fillStyle = '#6a5a46'; g.fillRect(px + 7, py + 15, 7, 2);
      discPx(g, px + 10, py + 9, 8, (dx, dy) => {
        const n = hash2(dx + 20, dy + 20, hs & 255) % 9;
        if (dx + dy < -6 || (dx + dy < -2 && n < 3)) return '#86d477';
        if (dx + dy > 6 || (dx + dy > 2 && n < 2)) return '#2f7a45';
        return n === 0 ? '#3f9150' : '#52a95c';
      });
    } else if (tt === T_UMB) {                                   // the 744萬 parasol that replaced it
      g.fillStyle = 'rgba(28,24,48,0.28)'; g.fillRect(px + 4, py + 13, 15, 5);
      discPx(g, px + 10, py + 9, 8, (dx, dy) => {
        if (dx * dx + dy * dy <= 2) return '#f2c14e';
        const a = Math.floor(((Math.atan2(dy, dx) + Math.PI) / (Math.PI * 2)) * 8);
        return a % 2 ? '#2fb5ad' : (dx + dy < -3 ? '#ffffff' : '#f4efe4');
      });
      g.fillStyle = '#ffd84a'; g.fillRect(px + 15, py + 15, 4, 3); g.fillStyle = '#b07a12'; g.fillRect(px + 16, py + 16, 2, 1);   // price tag
    }
    return;
  }
  // ── wall: a rooftop seen from above plus, where it faces the alley, its street facade ──
  const below = solidT(at(x, y + 1)), FACE = 8, topH = below ? T : T - FACE;
  const tints = th.tints || [th.roof];
  g.fillStyle = tints[hash2(x >> 1, y >> 1, lv.seed + 7) % tints.length]; g.fillRect(px, py, T, topH);
  const v = hs % 13;
  if (lv.theme === 'old') {
    g.fillStyle = th.roof2; for (let yy = 2; yy < topH; yy += 3) g.fillRect(px, py + yy, T, 1);
    if (v === 0) { g.fillStyle = th.edge; g.fillRect(px, py + Math.floor(topH / 2), T, 2); }
  } else if (v < 3) {                                            // corrugated tin roof
    g.fillStyle = th.tin; g.fillRect(px + 2, py + 2, T - 4, topH - 4);
    g.fillStyle = th.tin2; for (let xx = 3; xx < T - 2; xx += 2) g.fillRect(px + xx, py + 2, 1, topH - 4);
  } else if (v === 3 && topH >= 12) {                            // water tower
    // stainless rooftop water tank, Taipei-style
    const wy = py + Math.min(9, topH - 5);
    g.fillStyle = 'rgba(40,36,60,0.25)'; g.fillRect(px + 7, wy + 3, 9, 3);
    discPx(g, px + 10, wy, 4, (dx, dy) => (dx + dy < -2 ? '#ffffff' : dx + dy > 2 ? '#9aa0b4' : dy === 0 ? '#b8bdcc' : '#d4d8e4'));
  } else if (v === 4 && topH >= 10) {                            // AC unit
    g.fillStyle = PAL.ink; g.fillRect(px + 5, py + 3, 9, 7); g.fillStyle = '#c9c6d4'; g.fillRect(px + 6, py + 4, 7, 5);
    g.fillStyle = '#8e8a9e'; g.fillRect(px + 8, py + 5, 3, 3);
  } else if (v === 5 && topH >= 10) {                            // rooftop potted plants
    [[5, 5], [10, 7], [14, 4]].forEach(([dx, dy]) => { g.fillStyle = '#4fa35a'; g.fillRect(px + dx, py + dy, 3, 3); g.fillStyle = '#b8683a'; g.fillRect(px + dx, py + dy + 3, 3, 1); });
  } else {
    for (let i = 0; i < 4; i++) { g.fillStyle = th.roof2; g.fillRect(px + Math.floor(r() * T), py + Math.floor(r() * topH), 2, 1); }
  }
  // edges where the block meets open ground
  if (!solidT(at(x, y - 1))) { g.fillStyle = th.roofHi; g.fillRect(px, py, T, 1); }
  if (!solidT(at(x - 1, y))) { g.fillStyle = th.edge; g.fillRect(px, py, 1, topH); }
  if (!solidT(at(x + 1, y))) { g.fillStyle = th.edge; g.fillRect(px + T - 1, py, 1, topH); }
  if (!below) {
    const fy = py + topH;
    g.fillStyle = th.face; g.fillRect(px, fy, T, FACE);
    g.fillStyle = th.eave; g.fillRect(px, fy, T, 1);
    if (lv.theme === 'old') {                                     // 騎樓 arcade arches
      g.fillStyle = th.win; g.fillRect(px + 3, fy + 3, 6, 5); g.fillRect(px + 12, fy + 3, 6, 5);
      g.fillStyle = th.face; g.fillRect(px + 3, fy + 3, 1, 1); g.fillRect(px + 8, fy + 3, 1, 1); g.fillRect(px + 12, fy + 3, 1, 1); g.fillRect(px + 17, fy + 3, 1, 1);
      if (hs % 4 === 0) { g.fillStyle = '#d8343f'; g.fillRect(px + 13, fy + 4, 4, 2); }   // red lantern
    } else if (lv.theme === 'council') {                          // wood panelling, brass plaques, framed notices
      g.fillStyle = th.face2; g.fillRect(px + 1, fy + 2, 8, 5); g.fillRect(px + 11, fy + 2, 8, 5);
      g.fillStyle = th.face; g.fillRect(px + 2, fy + 3, 6, 3); g.fillRect(px + 12, fy + 3, 6, 3);
      if (hs % 3 === 0) { g.fillStyle = th.grille; g.fillRect(px + 7, fy + 3, 6, 3); g.fillStyle = th.win; g.fillRect(px + 8, fy + 4, 4, 1); }
    } else {                                                      // windows with 鐵窗 grilles, shop signs, AC boxes
      const lit = hs % 5 === 0;
      [[2, 7], [12, 6]].forEach(([wx, ww], k) => {
        if (k === 1 && v === 8) { g.fillStyle = '#e8e8f0'; g.fillRect(px + wx, fy + 2, 6, 5); g.fillStyle = '#a8a8b8'; g.fillRect(px + wx + 1, fy + 3, 3, 3); return; }
        g.fillStyle = lit && k === 0 ? th.winLit : th.win; g.fillRect(px + wx, fy + 2, ww, 4);
        g.fillStyle = th.grille; for (let xx = wx; xx < wx + ww; xx += 2) g.fillRect(px + xx, fy + 2, 1, 4);
        g.fillRect(px + wx, fy + 2, ww, 1);
      });
      if (v === 7) { g.fillStyle = '#d94a4a'; g.fillRect(px + 9, fy + 1, 3, 7); g.fillStyle = '#ffffff'; g.fillRect(px + 10, fy + 2, 1, 1); g.fillRect(px + 10, fy + 4, 1, 1); }
    }
    g.fillStyle = th.face2; g.fillRect(px, fy + FACE - 1, T, 1);
    if (!solidT(at(x - 1, y))) { g.fillStyle = th.eave; g.fillRect(px, fy, 1, FACE); }
    if (!solidT(at(x + 1, y))) { g.fillStyle = th.eave; g.fillRect(px + T - 1, fy, 1, FACE); }
  }
}

function renderMap(lv) {
  const [c, g] = makeCanvas(lv.w * TILE, lv.h * TILE);
  for (let y = 0; y < lv.h; y++) for (let x = 0; x < lv.w; x++) drawTile(g, lv, x, y);
  // street lamps at junctions: a pole base and a lamp head
  for (const l of lv.lamps) {
    const px = l.x * TILE, py = l.y * TILE;
    g.fillStyle = 'rgba(28,24,48,0.3)'; g.fillRect(px + 2, py + 3, 4, 2);
    g.fillStyle = PAL.ink; g.fillRect(px + 2, py + 1, 3, 3);
    g.fillStyle = '#ffe9a0'; g.fillRect(px + 3, py + 2, 1, 1);
  }
  return c;
}

// ───────────────────────────── 6. PARTICLES ─────────────────────────────
class Particles {
  constructor() { this.list = []; }
  clear() { this.list.length = 0; }
  emit(p) { if (this.list.length < 900) this.list.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 0.5, size: 1, drag: 0 }, p, { max: p.life || 0.5 })); }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.life -= dt;
      if (p.life <= 0 || (p.confetti && p.y > VIEW_H + 10)) { this.list.splice(i, 1); continue; }
      p.vy += p.g * dt; p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt * (p.g ? 0 : 1);
      p.x += (p.vx + (p.confetti ? Math.sin(p.life * 6 + (p.phase || 0)) * 18 : 0)) * dt;
      p.y += p.vy * dt;
    }
  }
  draw(ctx, ox = 0, oy = 0) {
    for (const p of this.list) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1) ** 0.6;
      ctx.fillStyle = p.color;
      if (p.confetti) {
        const flip = Math.sin(p.life * 14 + (p.phase || 0)) > 0;
        ctx.fillRect(snap(p.x - ox), snap(p.y - oy), flip ? 2 : 1, flip ? 1 : 2);
      } else ctx.fillRect(snap(p.x - ox), snap(p.y - oy), p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }
}

// ────────────────────────────── 7. INPUT ──────────────────────────────
/**
 * Keyboard: arrows/WASD move; Space confirms menus, taps to auto-throw, holds by a tree to chop.
 * J / K remain as optional advanced throw keys (小卷 / 大藍莓). P/Esc pauses.
 * Touch: left drag = joystick; one action button (tap = throw, hold near tree = chop).
 */
class Input {
  constructor(el, h) {
    this.k = { up: false, down: false, left: false, right: false };
    this.space = false; this.chopTouch = false;   // held for tree-chop
    this.joy = null; this.touchUI = false; this.fsAsked = false;
    const MAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
    window.addEventListener('keydown', (e) => {
      const m = MAP[e.code];
      if (m) { this.k[m] = true; e.preventDefault(); return; }
      if (e.code === 'Space') { e.preventDefault(); if (!this.space) { this.space = true; if (!e.repeat) h.primary(performance.now()); } return; }
      if (e.repeat) return;
      if (e.code === 'KeyJ') h.throwItem(performance.now());

  get vec() {

}

// ────────────────────────────── 8. GAME ──────────────────────────────
class Game {
  constructor(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    [this.lightC, this.lightG] = makeCanvas(VIEW_W, VIEW_H);
    this.vignette = Game.makeVignette();
    this.particles = new Particles();   // world: dust, chips, ink (under the darkness)
    this.glints = new Particles();      // world: sparkles that should shine through the dark
    this.cardFx = new Particles();      // ink dust from the 敗選 stamp
    this.hi = Number(localStorage.getItem(STORAGE_HI)) || 0;
    this.time = 0; this.shake = 0; this.flash = 0; this.flashColor = '255,255,255'; this.alarm = false; this.alarmLevel = 0;
    this.paused = false;
    this.debug = { god: false, noEvents: false };
    this.orientPaused = false; this.needLandscape = false;
    this.input = new Input(canvas, {
      primary: (t) => this.onPrimary(t),
      primaryUp: () => { this.chopping = false; this.input.chopTouch = false; },
      throwItem: (t) => { if (this.state === 'playing' && !this.paused) this.throwSquid(); else this.onConfirm(t); },
      secondary: () => { if (this.state === 'playing' && !this.paused) this.throwBerry(); },
      confirm: (t) => this.onConfirm(t),
      pause: () => this.togglePause(),
      blur: () => { if ((this.state === 'playing' || this.state === 'boss') && !this.paused) this.paused = true; },
      hitButton: (p) => this.hitButton(p),
      button: (b) => this.onButton(b),
      buttonUp: (b) => { if (b === 'act' || b === 'chop') { this.input.chopTouch = false; this.chopping = false; } },
      wantsJoystick: (p) => !this.paused && !this.needLandscape && ((this.state === 'playing' && p.x < VIEW_W * 0.55 && p.y > HUD_H) || (this.state === 'boss' && p.y > HUD_H)),
      requestFs: () => tryEnterFullscreen(),

    this.newGame(true);
  }
  /** Recreate view-sized buffers after VIEW_W/H change (mobile aspect adapt). */
  onViewResize() {
    [this.lightC, this.lightG] = makeCanvas(VIEW_W, VIEW_H);
    this.vignette = Game.makeVignette();
    if (this.cam && this.p) this.updateCamera(0, true);
    if (this.state === 'playing' || this.state === 'title' || this.state === 'help') this.computeLight();

  static makeVignette() {
    const [c, g] = makeCanvas(VIEW_W, VIEW_H);

    gr.addColorStop(0, 'rgba(235,30,45,0)'); gr.addColorStop(0.55, 'rgba(235,30,45,0.35)'); gr.addColorStop(1, 'rgba(235,30,45,0.95)');
    g.fillStyle = gr; g.fillRect(0, 0, VIEW_W, VIEW_H);
    return c;
  }

  // ── Lifecycle ──
  newGame(demo = false) {
    this.demo = demo;
    this.baseSeed = demo ? 20260 : (Math.random() * 1e9) | 0;
    this.score = 0; this.lives = PLAYER.LIVES; this.battery = 100;
    this.inv = { squid: 1, berry: 0, save: 0 };
    this.stats = { reloc: 0, caught: 0, thrown: 0, trees: 0, rats: 0, saves: 0 };
    this.newBest = false; this.acceptAt = null; this.stamped = false; this.cardFx.clear();
    this.seq = null; this.banner = null; this.toasts = []; this.alarm = false; this.alarmLevel = 0;
    this.bossReached = false; this.diedInBoss = false; this.boss = null; this.bp = null; this.cold = null;
    this.surviveT = 0; this.surviveDone = false;
    this.tips = { milk: 0, squid: 0, berry: 0, phone: 0, rat: 0, current: 0, tree: 0, chaser: 0 };
    this.loadLevel(1);
  }
  start() {
    this.newGame(false);
    this.state = 'playing'; this.stateT = 0; this.paused = false;

  }
  loadLevel(n) {
    const lv = this.lv = genLevel(n, this.baseSeed + n * 7919);
    this.mapC = renderMap(lv); this.mapG = this.mapC.getContext('2d');
    const s = this.tileCenter(lv.start.x, lv.start.y);
    this.p = { x: s.x, y: s.y, ang: 0, face: 1, fx: 1, fy: 0, anim: 0, moving: false, invuln: 1.5, slowT: 0, sweatT: 0, bubble: null, blinkT: 3, dustT: 0, panicCd: 0, panicN: 0 };
    // face into the maze
    const open = DIRS4.find(([dx, dy]) => !this.solidTile(lv.start.x + dx, lv.start.y + dy)) || [1, 0];
    this.p.fx = open[0]; this.p.fy = open[1]; this.p.ang = Math.atan2(open[1], open[0]); if (open[0]) this.p.face = open[0];
    const e = this.tileCenter(lv.exit.x, lv.exit.y);
    this.exit = { x: e.x, y: e.y, run: null };
    this.shots = []; this.rings = []; this.cuts = []; this.texts = []; this.minion = null;
    this.currents = []; this.currentT = rand(...CURRENT.INTERVAL) * (0.55 + 0.1 * Math.random());
    this.currentWarnFlash = 0; this.treeHp = {}; this.chopping = false; this.chopTarget = null;
    this.particles.clear(); this.glints.clear();
    this.milkTaken = false;
    this.placeItems(); this.spawnChasers(); this.spawnRats();
    this.ratWaveT = n >= 2 ? rand(16, 24) : Infinity; this.ratWarn = 0;
    this.dirtyFields = true; this.updateFields();

    this.computeLight();
  }
  levelBanner() {
    const n = this.lv.n;
    const sub = n === 1 ? '找到「連任」大門！' : n === 3 ? `魔王 ${NAMES.boss} 出沒注意！` : `連任大門溜走 ${this.stats.reloc} 次・下一扇一定行！`;
    this.banner = { title: `第${n}關・${this.lv.place}`, sub, t: 0, dur: 2.4, style: 'gold' };
  }
  onPrimary(t) {
    if (this.state === 'playing' && !this.paused) {
      // Hold Space by a tree = chop; otherwise Space tap = smart throw.
      if (this.faceTree()) { this.chopping = true; this.tipOnce('tree', wantTouchPrompt() ? '按住「砍」鍵砍樹開路！' : '按住空白鍵砍樹開路！', '#a8e89a'); return; }
      this.smartThrow();
    } else this.onConfirm(t);
  }
  onConfirm(pressT) {
    if (this.paused) { this.paused = false; return; }
    if (this.state === 'title') { this.state = 'help'; this.stateT = 0; return; }
    if (this.state === 'help') { this.start(); return; }
    // end cards only close on a fresh press that began after the input lock lifted
    else if ((this.state === 'over' || this.state === 'winFinal') && this.acceptAt !== null && pressT >= this.acceptAt) this.start();
  }
  togglePause() { if (this.state === 'playing' || this.state === 'boss') this.paused = !this.paused; }
  /** Auto-pick: 大藍莓 if 2+ chasers nearby and you have one; else 小卷; else whatever remains. */
  smartThrow() {
    if (this.state !== 'playing' || this.seq || this.paused) return;
    const p = this.p;
    const near = this.chasers.filter((c) => c.mode !== 'stun' && c.mode !== 'argue' && Math.hypot(c.x - p.x, c.y - p.y) < TILE * 5.5).length;
    if (near >= 2 && this.inv.berry > 0) { this.throwBerry(); return; }
    if (this.inv.squid > 0) { this.throwSquid(); return; }
    if (this.inv.berry > 0) { this.throwBerry(); return; }
    this.text('沒有道具了', p.x, p.y - 32, '#ffb0c8', 0.9);
  }
  tipOnce(key, msg, color = '#ffd45e') {
    if (!this.tips) this.tips = {};
    if (this.tips[key]) return;
    this.tips[key] = 1;
    this.toast(msg, color);
  }
  touchButtons() {
    const mobile = this.input.touchUI || document.body.classList.contains('mobile-fill');
    const nearTree = this.state === 'playing' && this.faceTree();
    const actR = mobile ? Math.round(clamp(VIEW_H * 0.23, 48, 58)) : 18;
    const pauseR = mobile ? 18 : 9;
    const pad = mobile ? 14 : 8;
    const btns = [{ id: 'pause', x: VIEW_W - pauseR - 10, y: HUD_H + pauseR + 8, r: pauseR }];
    if (this.state === 'playing') {
      btns.unshift({ id: 'act', x: VIEW_W - actR - pad, y: VIEW_H - actR - pad, r: actR, label: nearTree ? '砍' : '丟' });
    }
    return btns;
  }
  hitButton(p) {
    if (this.needLandscape) return null;
    if (this.paused) {
      const pause = this.touchButtons().find((b) => b.id === 'pause');
      if (pause && Math.hypot(p.x - pause.x, p.y - pause.y) <= pause.r + 8) return 'pause';
      return null;
    }
    if (this.state !== 'playing' && this.state !== 'boss') return null;
    const slop = (this.input.touchUI || document.body.classList.contains('mobile-fill')) ? 10 : 4;
    const b = this.touchButtons().find((b) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + slop);
    return b ? b.id : null;
  }
  onButton(id) {
    if (id === 'pause') this.togglePause();
    else if (id === 'act' || id === 'chop') {
      if (this.faceTree()) { this.input.chopTouch = true; this.chopping = true; this.tipOnce('tree', wantTouchPrompt() ? '按住「砍」鍵砍樹開路！' : '按住空白鍵砍樹開路！', '#a8e89a'); }
      else this.smartThrow();
    }
    else if (id === 'squid') this.throwSquid();
    else if (id === 'berry') this.throwBerry();
  }

  // ── Map helpers ──
  tileCenter(tx, ty) { return { x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2 }; }
  solidTile(tx, ty) { const lv = this.lv; return tx < 0 || ty < 0 || tx >= lv.w || ty >= lv.h || solidT(lv.t[ty * lv.w + tx]); }
  solidAt(x, y) { return this.solidTile(Math.floor(x / TILE), Math.floor(y / TILE)); }
  tileIdx(x, y) { const lv = this.lv; return clamp(Math.floor(y / TILE), 0, lv.h - 1) * lv.w + clamp(Math.floor(x / TILE), 0, lv.w - 1); }
  los(x0, y0, x1, y1) {
    const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 4);
    for (let i = 1; i < n; i++) if (this.solidAt(lerp(x0, x1, i / n), lerp(y0, y1, i / n))) return false;
    return true;
  }
  updateFields() {
    const lv = this.lv, ti = this.tileIdx(this.p.x, this.p.y);
    if (this.dirtyFields) {
      // 南鼠北送 rats run "north": down a distance field seeded on the top-most open row
      const src = [];
      for (let y = 1; y < lv.h && !src.length; y++) for (let x = 1; x < lv.w - 1; x++) if (!solidT(lv.t[y * lv.w + x])) src.push(y * lv.w + x);
      this.north = bfs(lv, src);
    }
    if (this.dirtyFields || ti !== this.fieldTile) { this.field = bfs(lv, [ti]); this.fieldTile = ti; }
    this.dirtyFields = false;
  }
  repaintAround(tx, ty) {
    const lv = this.lv;
    for (let y = ty - 1; y <= ty + 1; y++) for (let x = tx - 1; x <= tx + 1; x++) if (x >= 0 && y >= 0 && x < lv.w && y < lv.h) drawTile(this.mapG, lv, x, y);
    const g = this.mapG;
    for (const l of lv.lamps) if (Math.abs(l.x - tx) <= 1 && Math.abs(l.y - ty) <= 1) {
      const px = l.x * TILE, py = l.y * TILE;
      g.fillStyle = 'rgba(28,24,48,0.3)'; g.fillRect(px + 2, py + 3, 4, 2);
      g.fillStyle = PAL.ink; g.fillRect(px + 2, py + 1, 3, 3);
      g.fillStyle = '#ffe9a0'; g.fillRect(px + 3, py + 2, 1, 1);
    }
  }
  /** Space the picks out: each new tile at least `gap` (Manhattan) from everything already used. */
  pickSpread(pool, used, minStart, gap = 3) {
    const lv = this.lv;
    for (const i of shuffle(pool.slice())) {
      if (used.has(i) || lv.distStart[i] < minStart) continue;
      const x = i % lv.w, y = (i / lv.w) | 0;
      let ok = true;
      for (const u of used) if (Math.abs(u % lv.w - x) + Math.abs(((u / lv.w) | 0) - y) < gap) { ok = false; break; }
      if (ok) { used.add(i); return i; }
    }
    return -1;
  }
  placeItems() {
    const lv = this.lv, n = lv.n, used = new Set([lv.exit.y * lv.w + lv.exit.x, lv.start.y * lv.w + lv.start.x]);
    this.items = [];
    const add = (kind, i, extra = {}) => { if (i >= 0) this.items.push({ kind, x: (i % lv.w) * TILE + TILE / 2, y: ((i / lv.w) | 0) * TILE + TILE / 2, t: Math.random() * 6, cd: 0, vis: 0, ...extra }); };
    for (let k = 0; k < 4 + Math.min(4, n >> 1); k++) add('squid', this.pickSpread(lv.floors, used, 3));
    for (let k = 0; k < (n >= 2 ? 2 : 1); k++) if (Math.random() < 0.85) add('berry', this.pickSpread(lv.floors, used, 7));
    const milks = n >= 3 ? 3 : 2, fake = Math.random() < 0.7 ? randInt(0, milks - 1) : -1;
    for (let k = 0; k < milks; k++) add('milk', this.pickSpread(lv.floors, used, 5, 5), { fake: k === fake });
    if (n >= 2 && Math.random() < 0.5) add('phone', this.pickSpread(lv.floors, used, 8, 4));
  }
  makeChaser(kind, tx, ty) {
    const boss = kind === 'boss', lm = 1 + 0.045 * (this.lv.n - 1);
    const { x, y } = this.tileCenter(tx, ty);
    return {
      kind, boss, x, y, tx, ty, ptx: tx, pty: ty, mode: 'wander', modeT: 0, lost: 0, cool: 0,
      wanderSpeed: (boss ? 30 : 25) * lm, chaseSpeed: Math.min(boss ? 70 : 63, (boss ? 61 : 50) * lm),
      face: 1, anim: Math.random() * 4, jit: Math.random() * 6, seeT: Math.random() * 0.2, sees: false,
      bubble: null, bubbleCd: 0, alertT: 0, mark: '', markT: 0, lineIdx: -1, met: false, argueT: 0, argueFlip: false, spr: null, vis: 0,
    };
  }
  spawnChasers() {

    const used = new Set(), picks = [];

    this.chasers = picks.map((i, k) => this.makeChaser(n >= 3 && k === 0 ? 'boss' : CHASER_ORDER[k % CHASER_ORDER.length], i % lv.w, (i / lv.w) | 0));
  }
  spawnRats() { this.rats = []; for (let k = 0; k < 5 + this.lv.n; k++) this.addRat(false); }
  addRat(wave, i) {
    const lv = this.lv;
    if (i === undefined) {
      const p = this.p, pool = lv.floors.filter((j) => Math.hypot((j % lv.w) * TILE - p.x, ((j / lv.w) | 0) * TILE - p.y) > TILE * 7);
      if (!pool.length) return;

    }
    const tx = i % lv.w, ty = (i / lv.w) | 0, c = this.tileCenter(tx, ty);
    this.rats.push({ kind: Math.random() < 0.6 ? 'rat' : 'roach', x: c.x + rand(-3, 3), y: c.y, tx, ty, ptx: tx, pty: ty, mode: wave ? 'wave' : 'roam', t: Math.random() * 3, flee: 0, cool: 0, life: 0, face: 1, counted: false, vis: 0 });
  }

  // ── Update ──
  update(dt) {
    this.time += dt;
    if (this.needLandscape) return;          // portrait overlay: freeze until landscape
    if (this.paused) return;
    this.stateT += dt;
    this.shake = Math.max(0, this.shake - dt * 18);
    this.flash = Math.max(0, this.flash - dt * 2.5);
    if (this.state === 'title' || this.state === 'help') this.updateDemo(dt);
    else if (this.state === 'over' || this.state === 'winFinal') this.updateEnd(dt);
    else if (this.state === 'boss') this.updateBossPhase(dt);
    else if (this.state === 'bossWin') this.updateFakeWin(dt);
    else if (this.state === 'coldwater') this.updateColdWater(dt);
    else {
      if (this.seq) this.updateSeq(dt); else this.updatePlay(dt);
      this.updateCamera(dt);
    }
    this.updateFx(dt);
  }
  updateDemo(dt) {
    const p = this.p;
    p.ang = -Math.PI / 2 + Math.sin(this.time * 0.55) * 1.45;
    p.fx = Math.cos(p.ang); p.fy = Math.sin(p.ang); p.face = p.fx >= 0 ? 1 : -1;
    this.computeLight();
    for (const c of this.chasers) { c.anim += dt; this.stepTiles(c, c.wanderSpeed * dt, () => null, true); }
    for (const r of this.rats) { r.t += dt; this.stepTiles(r, (r.kind === 'rat' ? 34 : 26) * dt, () => null, true); }
    this.updateCamera(dt);
  }
  updatePlay(dt) {
    this.score += 8 * dt;
    this.updatePlayer(dt);
    this.battery = Math.max(0, this.battery - LIGHT.DRAIN * dt);
    this.alarm = this.chasers.some((c) => c.mode === 'chase') || this.currents.some((c) => c.mode === 'rush');
    this.computeLight();
    this.updateFields();
    for (const c of this.chasers) this.updateChaser(c, dt);
    this.updateRats(dt);
    this.updateShots(dt);
    this.updateItems(dt);
    this.updateEvents(dt);
    if (!this.seq) this.checkExit();
  }
  updatePlayer(dt) {
    const p = this.p, v = this.input.vec, sp = PLAYER.SPEED * (p.slowT > 0 ? PLAYER.SLOW : 1);
    p.slowT = Math.max(0, p.slowT - dt); p.invuln = Math.max(0, p.invuln - dt); p.panicCd = Math.max(0, p.panicCd - dt); p.sweatT = Math.max(0, p.sweatT - dt);
    p.moving = Math.abs(v.x) + Math.abs(v.y) > 0.05;
    if (p.moving) {
      const d = Math.hypot(v.x, v.y);
      p.fx = v.x / d; p.fy = v.y / d;
      if (Math.abs(v.x) > 0.2) p.face = v.x > 0 ? 1 : -1;
      this.moveBody(p, v.x * sp * dt, v.y * sp * dt);
      p.anim += dt * (p.slowT > 0 ? 5 : 9);

  /** Torch: a ray-cast cone (walls block it, facades catch the light) plus a small glow around him. */

  // ── Chasers ──

  say(e, text, t = 2.4, color = '#c2364a') { e.bubble = { text, t, color }; }

  updateChaser(c, dt) {

  /** Tile-to-tile walking (chasers, critters): reach a tile centre, then ask `choose` for the next. */
  stepTiles(e, step, choose) {

  // ── Items & throwing ──

  throwBerry() {

        if (this.solidAt(nx, ny) || s.t > 1.3) { this.splat(s.x, s.y, ['#3a3150', '#5b4f78', '#ff9ab8']); this.shots.splice(k, 1); continue; }
        s.x = nx; s.y = ny;
        const hit = this.chasers.find((c) => c.mode !== 'stun' && Math.abs(c.x - s.x) < 11 && s.y - c.y > -15 && s.y - c.y < 9);   // body-shaped: the sprite stands above its feet
        if (hit) { this.stunChaser(hit); this.splat(s.x, s.y, ['#ff9ab8', '#ffc4d6', '#8fe07a']); this.shots.splice(k, 1); }
        else this.slowCurrentsNear(s.x, s.y, 14);
      } else {
        const DUR = 0.55;
        if (this.solidAt(nx, ny) || s.t >= DUR) { this.berryBurst(s.x, s.y); this.shots.splice(k, 1); continue; }
        s.x = nx; s.y = ny; s.z = 6 + Math.sin((s.t / DUR) * Math.PI) * 16;
      }
    }
  }
  splat(x, y, cols) {
    for (let i = 0; i < 10; i++) { const a = rand(0, Math.PI * 2), sp = rand(15, 55); this.particles.emit({ x, y: y - 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 4, life: rand(0.3, 0.55), size: Math.random() < 0.4 ? 2 : 1, color: pick(cols) }); }
  }
  stunChaser(c) {
    c.mode = 'stun'; c.modeT = 3; c.bubble = null; c.alertT = 0;
    this.text('腸胃不適', c.x, c.y - 30, '#8fe07a', 1.4);
    this.say(this.p, '沒有集體中毒！', 1.9, '#2f7a45');
    this.score += 50; this.shake = 2;
  }
  berryBurst(x, y) {
    this.rings.push({ x, y, t: 0, dur: 0.7, r: 110 });
    for (let i = 0; i < 26; i++) { const a = rand(0, Math.PI * 2), sp = rand(30, 120); this.glints.emit({ x, y: y - 4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 3, life: rand(0.4, 0.8), size: Math.random() < 0.5 ? 2 : 1, color: pick(['#5a62d6', '#8a93f0', '#eef0ff', '#b9a0ff']) }); }
    let n = 0;
    for (const c of this.chasers) {
      if (Math.hypot(c.x - x, c.y - y) > 110) continue;
      c.mode = 'argue'; c.modeT = 5; c.argueT = n * 0.55; c.argueFlip = n % 2 === 1; c.bubble = null; c.alertT = 0;
      n++; this.score += 80;
    }
    this.text(n ? '吵起來了！' : '這是藍莓嗎？', x, y + 24, '#c9b4ff', 1.3);
    this.slowCurrentsNear(x, y, 110);
    this.shake = 3;
  }
  updateItems(dt) {
    const p = this.p;
    for (let k = this.items.length - 1; k >= 0; k--) {
      const it = this.items[k];
      it.t += dt; it.cd = Math.max(0, it.cd - dt);
      this.updateVis(it, it.x, it.y - 4, dt);
      // Sparkles only when the item is actually visible — no free giveaways in the dark.
      if (it.vis > 0.35 && Math.random() < dt * 0.7) this.glints.emit({ x: it.x + rand(-6, 6), y: it.y - 5 + rand(-6, 3), vy: -8, life: 0.6, color: '#ffffff', size: 1 });
      if (Math.hypot(it.x - p.x, it.y - p.y) > 11) continue;
      if (this.collect(it)) {
        this.items.splice(k, 1);
        for (let i = 0; i < 10; i++) { const a = rand(0, Math.PI * 2), sp = rand(20, 60); this.glints.emit({ x: it.x, y: it.y - 5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 10, drag: 3, life: rand(0.3, 0.6), color: pick(['#ffffff', '#ffe27a']) }); }
      }
    }
  }
  collect(it) {
    const say = (s, c) => this.text(s, it.x, it.y - 24, c, 1.3);
    switch (it.kind) {
      case 'squid':
        if (this.inv.squid >= 9) return false;
        this.inv.squid++; this.score += 20; say('+小卷', '#ffb0c8');
        this.tipOnce('squid', wantTouchPrompt() ? '點「丟」丟小卷・議員跑廁所 3 秒' : '空白鍵丟小卷・議員跑廁所 3 秒', '#ffb0c8');
        return true;
      case 'berry':
        if (this.inv.berry >= 3) return false;
        this.inv.berry++; this.score += 40; say('+大藍莓', '#c9b4ff');
        this.tipOnce('berry', wantTouchPrompt() ? '附近人多時點「丟」會丟大藍莓吵架' : '附近人多時空白鍵會丟大藍莓吵架', '#c9b4ff');
        return true;
      case 'phone':
        if (this.inv.save > 0) return false;
        this.inv.save = 1; say('首長救駕 待命', '#9cc8ff');
        this.tipOnce('phone', '首長救駕・被抓時擋一次不扣命', '#9cc8ff');
        return true;
      case 'milk':
        if (this.milkTaken) { if (it.cd <= 0) { it.cd = 2.2; say('每週限領一瓶', '#ffffff'); } return false; }
        if (it.fake) { say('忘記兌換…', '#cfc8e0'); this.splat(it.x, it.y, ['#d9d6e2', '#aaa4b6']); this.tipOnce('milk', '鮮奶補電力・小心有假的！', '#bfe6ff'); return true; }
        this.milkTaken = true; this.battery = 100; this.score += 30;
        say('鮮奶充電！', '#ffffff'); this.toast('每週限領一瓶', '#bfe6ff');
        this.tipOnce('milk', '鮮奶補電力・小心有假的！', '#bfe6ff');
        this.flash = 0.3; this.flashColor = '255,255,255';
        return true;
    }
    return false;
  }

  // ── Timed events: 洋流 hazard + 南鼠北送 (no auto tree-cutting — player chops) ──
  updateEvents(dt) {
    if (!this.debug.noEvents) {
      if ((this.ratWaveT -= dt) <= 0) { this.ratWaveT = rand(38, 52); this.startRatWave(); }
      if ((this.currentT -= dt) <= 0) { this.spawnCurrent(); this.currentT = Math.max(9, rand(...CURRENT.INTERVAL) - (this.lv.n - 1) * CURRENT.INTERVAL_LV); }
    }
    if (this.ratWarn > 0 && (this.ratWarn -= dt) <= 0) this.spawnRatWave();
    this.currentWarnFlash = Math.max(0, this.currentWarnFlash - dt);
    this.updateCurrents(dt);
    this.updateChop(dt);
  }

  /** Adjacent tree in the facing direction (or any cardinal neighbour if facing into open air). */
  faceTree() {
    if (this.state !== 'playing' || this.seq) return null;
    const p = this.p, tx = Math.floor(p.x / TILE), ty = Math.floor(p.y / TILE);
    const fx = Math.abs(p.fx) >= Math.abs(p.fy) ? Math.sign(p.fx || p.face) : 0;
    const fy = fx === 0 ? Math.sign(p.fy || 0) : 0;
    const tryAt = (x, y) => {
      if (x < 0 || y < 0 || x >= this.lv.w || y >= this.lv.h) return null;
      const i = y * this.lv.w + x;
      return this.lv.t[i] === T_TREE ? { i, x, y } : null;
    };
    let hit = tryAt(tx + fx, ty + fy);
    if (hit) return hit;
    // also allow standing beside a tree (orthogonal neighbour within 1 tile)
    for (const [dx, dy] of DIRS4) {
      hit = tryAt(tx + dx, ty + dy);
      if (hit && Math.hypot(p.x - (hit.x * TILE + 10), p.y - (hit.y * TILE + 10)) < TILE * 1.35) return hit;
    }
    return null;
  }
  updateChop(dt) {
    const holding = this.input.space || this.input.chopTouch;
    const tree = this.faceTree();
    if (!holding || !this.chopping || !tree) {
      if (!holding) this.chopping = false;
      this.chopTarget = null;
      return;
    }
    this.chopTarget = tree;
    const hp = this.treeHp[tree.i] == null ? TREE.MAX_HP : this.treeHp[tree.i];
    const next = Math.max(0, hp - dt);
    this.treeHp[tree.i] = next;
    const cx = tree.x * TILE + 10, cy = tree.y * TILE + 10;
    if (Math.random() < dt * 40) this.particles.emit({ x: cx + rand(-6, 6), y: cy + rand(-8, 4), vx: rand(-55, 55), vy: rand(-70, -10), g: 180, life: rand(0.25, 0.5), size: Math.random() < 0.4 ? 2 : 1, color: pick(['#c8935a', '#8a5a2c', '#52a95c', '#86d477', '#ffe9a0']) });
    if (Math.random() < dt * 18) this.glints.emit({ x: cx + rand(-4, 4), y: cy + 2, vx: rand(-30, 30), vy: rand(-40, -8), g: 90, life: 0.25, color: '#ffd84a' });
    this.shake = Math.max(this.shake, 0.8);
    if (next <= 0) this.finishChop(tree);
  }
  finishChop(tree) {
    const cx = tree.x * TILE + 10, cy = tree.y * TILE + 10;
    this.lv.t[tree.i] = T_UMB;
    delete this.treeHp[tree.i];
    this.repaintAround(tree.x, tree.y);
    this.stats.trees++; this.dirtyFields = true; this.updateFields();
    for (let i = 0; i < 16; i++) this.particles.emit({ x: cx + rand(-8, 8), y: cy + rand(-8, 6), vx: rand(-40, 40), vy: rand(-40, 0), drag: 3, life: 0.55, color: pick(['#e6e0f0', '#2fb5ad', '#ffffff', '#c8935a']) });
    this.text('744萬遮陽傘', cx, cy - 16, '#ffd45e', 1.8);
    this.toast(`亂砍樹 ${this.stats.trees} 棵`, '#a8e89a');
    this.chopping = false; this.chopTarget = null; this.input.chopTouch = false;
    this.shake = 3; this.flash = 0.2; this.flashColor = '180,220,160';
  }
  /** Debug/test: instantly fell `n` nearby trees into 遮陽傘. */
  startCut(maxN) {
    const lv = this.lv, ptx = this.p.x / TILE, pty = this.p.y / TILE;
    const trees = [];
    for (let i = 0; i < lv.t.length; i++) if (lv.t[i] === T_TREE) trees.push(i);
    if (!trees.length) return 0;
    const dist = (i) => Math.hypot((i % lv.w) + 0.5 - ptx, ((i / lv.w) | 0) + 0.5 - pty);
    trees.sort((a, b) => dist(a) - dist(b));
    const k = Math.min(trees.length, maxN || 3);
    for (let j = 0; j < k; j++) {
      const i = trees[j], x = i % lv.w, y = (i / lv.w) | 0;
      this.finishChop({ i, x, y });
    }
    return k;
  }

  // ── 洋流 hazard ──
  spawnCurrent(at) {
    const lv = this.lv, p = this.p;
    let i = at;
    if (i == null) {
      const pool = lv.floors.filter((j) => {
        const d = Math.hypot((j % lv.w) * TILE + 10 - p.x, ((j / lv.w) | 0) * TILE + 10 - p.y);
        return d > TILE * 7 && d < TILE * 16;
      });
      if (!pool.length) return null;
      i = pick(pool);
    }
    const tx = i % lv.w, ty = (i / lv.w) | 0, c = this.tileCenter(tx, ty);
    const cur = {
      x: c.x, y: c.y, tx, ty, ptx: tx, pty: ty,
      mode: 'warn', t: 0, life: CURRENT.LIFE, slowT: 0, anim: Math.random() * 4,
      face: 1, warnDir: 0, vis: 0,
    };
    cur.warnDir = Math.atan2(p.y - cur.y, p.x - cur.x);
    this.currents.push(cur);
    this.currentWarnFlash = CURRENT.WARN;
    this.toast('洋流來了！', '#7ec8ff');
    this.tipOnce('current', '洋流碰到會扣命・快閃！', '#7ec8ff');
    this.shake = Math.max(this.shake, 2);
    return this.currents.length - 1;
  }
  updateCurrents(dt) {
    const p = this.p;
    for (let k = this.currents.length - 1; k >= 0; k--) {
      const c = this.currents[k];
      c.t += dt; c.anim += dt; c.slowT = Math.max(0, c.slowT - dt);
      this.updateVis(c, c.x, c.y, dt);
      if (c.mode === 'warn') {
        c.warnDir = Math.atan2(p.y - c.y, p.x - c.x);
        if (c.t >= CURRENT.WARN) { c.mode = 'rush'; c.t = 0; }
        continue;
      }
      // rush: pathfind toward player via distance field
      c.life -= dt;
      if (c.life <= 0) {
        for (let i = 0; i < 10; i++) this.particles.emit({ x: c.x + rand(-8, 8), y: c.y + rand(-6, 6), vx: rand(-40, 40), vy: rand(-30, 10), drag: 3, life: 0.4, color: pick(['#7ec8ff', '#bfe8ff', '#ffffff']) });
        this.currents.splice(k, 1); continue;
      }
      const sp = CURRENT.SPEED * (c.slowT > 0 ? CURRENT.SLOW : 1) * (1 + 0.04 * (this.lv.n - 1));
      if (this.field) {
        this.stepTiles(c, sp * dt, (x, y, opts) => {
          let best = null, bd = 1e9;
          for (const o of opts) { const d = this.field[o[1] * this.lv.w + o[0]]; if (d >= 0 && d < bd) { bd = d; best = o; } }
          return best;
        });
      } else {
        const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy) || 1;
        c.x += (dx / d) * sp * dt; c.y += (dy / d) * sp * dt;
      }
      if (Math.random() < dt * 22) this.particles.emit({ x: c.x + rand(-6, 6), y: c.y + rand(-4, 4), vx: rand(-20, 20), vy: rand(-25, 5), life: 0.35, color: pick(['#7ec8ff', '#ffffff', '#4aa3f0']), size: Math.random() < 0.5 ? 2 : 1 });
      // hit player
      if (!this.seq && p.invuln <= 0 && !this.debug.god && Math.hypot(c.x - p.x, c.y - p.y) < CURRENT.HIT) {
        this.caughtByCurrent(c);
        this.currents.splice(k, 1);
      }
    }
  }
  caughtByCurrent(c) {
    if (this.seq) return;
    // same as chaser catch, but no 首長救駕 (wave isn't a councillor) — still allow save phone? User said "same as being caught". Keep save.
    if (this.inv.save > 0) {
      // fake a phantom "by" for save animation near the wave
      const phantom = { x: c.x, y: c.y, mode: 'stun', modeT: 0, bubble: null, alertT: 0 };
      this.startSave(phantom);
      return;
    }
    this.lives--; this.stats.caught++;
    this.seq = { type: 'caught', t: 0, by: { x: c.x, y: c.y, bubble: null, alertT: 0, kind: 'boss' } };
    this.shake = 6; this.flash = 0.7; this.flashColor = '90,180,255';
    this.toast('被洋流衝倒！', '#7ec8ff');
    this.say(this.p, '糟糕，又被沖走了', 2.0, PANIC.COLOR);
  }
  /** Squid/berry briefly slow currents; they do not stun or stop them. */
  slowCurrentsNear(x, y, r) {
    for (const c of this.currents) {
      if (c.mode !== 'rush') continue;
      if (Math.hypot(c.x - x, c.y - y) < r) { c.slowT = CURRENT.SLOW_T; this.text('洋流減速…', c.x, c.y - 20, '#bfe8ff', 0.9); }
    }
  }

  // ── Feedback ──
  text(str, x, y, color, dur = 1.2) { this.texts.push({ str, x, y, color, t: 0, dur }); }
  toast(text, color = '#ffffff') { this.toasts.push({ text, color, t: 0 }); if (this.toasts.length > 3) this.toasts.shift(); }
  updateFx(dt) {
    this.particles.update(dt); this.glints.update(dt);
    for (let i = this.texts.length - 1; i >= 0; i--) if ((this.texts[i].t += dt) > this.texts[i].dur) this.texts.splice(i, 1);
    for (let i = this.toasts.length - 1; i >= 0; i--) if ((this.toasts[i].t += dt) > 2.6) this.toasts.splice(i, 1);
    if (this.banner && (this.banner.t += dt) > this.banner.dur) this.banner = null;
    for (let i = this.rings.length - 1; i >= 0; i--) if ((this.rings[i].t += dt) > this.rings[i].dur) this.rings.splice(i, 1);
    if (this.p.bubble && (this.p.bubble.t -= dt) <= 0) this.p.bubble = null;
    const m = this.minion;
    if (m) {
      if (m.bubble && (m.bubble.t -= dt) <= 0) m.bubble = null;
      this.updateVis(m, m.x, m.y - 6 - (m.z || 0), dt);
      if (m.leaving) { m.lt += dt; m.x -= m.face * 110 * dt; m.z = Math.abs(Math.sin(m.lt * 12)) * 3; if (m.lt > 1.1) this.minion = null; }
    }
    this.alarmLevel = approach(this.alarmLevel, this.alarm && this.state === 'playing' && !this.seq ? 1 : 0, dt * 3);
  }
  saveHi() {
    const s = Math.floor(this.score);
    if (s > this.hi) { this.newBest = this.hi > 0; this.hi = s; localStorage.setItem(STORAGE_HI, String(s)); }
  }
  // ═══════════════════════════ BOSS PHASE ═══════════════════════════
  // Landscape Galaga-style dodge after clearing maze level 3. Visual cues only (no SFX).
  beginBossTransition() {
    this.bossReached = true;
    this.state = 'boss'; this.stateT = 0; this.paused = false; this.seq = null;
    this.banner = { title: '最終關：沈伯洋來了', sub: '左右閃避・鮮奶齊發！', t: 0, dur: 2.8, style: 'boss' };
    this.shake = 5; this.flash = 0.5; this.flashColor = '120,80,200';
    this.initBossFight();
  }
  initBossFight() {
    this.bp = {
      x: VIEW_W / 2, vx: 0, fireCd: 0.4, barrel: 0, recoil: 0, flash: [0, 0],
      invuln: 2.0, hurtT: 0, ko: false, blinkIn: 2, blinkT: 0, roll: 0,
    };
    this.boss = {
      x: VIEW_W / 2, y: -50, hp: BOSS_HP, chip: BOSS_HP, stage: 1, revives: 0,
      state: 'enter', t: 0, patT: 2.0, patIdx: 0, flash: 0, steam: 0, from: 0,
      bubble: null, bubbleCd: 1.5, lineIdx: -1,
    };
    this.bShots = []; this.bEnemyShots = []; this.bPending = [];
    this.bMinions = []; this.surviveT = 0; this.surviveDone = false;
    this.fakeWinT = 0; this.cold = null; this.overIn = 0;
    this.fxBoss = new Particles();
  }
  laterB(t, fn) { this.bPending.push({ t, fn }); }
  bossBox() { const b = this.boss; return { x0: b.x - 17, x1: b.x + 17, y0: b.y - 26, y1: b.y + 18 }; }
  bpHitbox() {
    const p = this.bp, by = SURVIVE.BASE_Y;
    return { x0: p.x - 8, x1: p.x + 8, y0: by - 20, y1: by - 4 };
  }
  overlap(a, b) { return a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0; }
  bossTuning() {
    const n = this.boss.stage;
    return {
      speed: Math.min(BOSS.MAX_SPEEDUP, 1 + 0.055 * (n - 1)),
      every: Math.max(1.25, [2.15, 2.15, 1.85, 1.65, 1.5][n] || 1.55 - 0.04 * (n - 3)),
      move: Math.min(1.35, 0.7 + 0.1 * (n - 1)),
    };
  }
  clearBEnemyShots() {
    for (const s of this.bEnemyShots) this.puffB(s.x, s.y, 3);
    this.bEnemyShots.length = 0;
  }
  puffB(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(15, 60);
      this.fxBoss.emit({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 3, life: rand(0.3, 0.6), size: Math.random() < 0.5 ? 2 : 1, color: pick(['#ffffff', '#f2eefa', '#d9d4ea']) });
    }
  }
  sprayB(x, y) {
    this.fxBoss.emit({ x, y, vx: rand(-25, 25), vy: rand(-40, -10), g: 120, life: rand(0.25, 0.45), color: pick(['#ffffff', '#bfe8ff', '#7fd0ff']) });
  }
  confettiB(n) {
    const cols = ['#ff5a6e', '#ffd84a', '#5fd38a', '#5fb4ff', '#c58cff', '#ffffff', '#ff9ab8'];
    for (let i = 0; i < n; i++) this.fxBoss.emit({ x: rand(0, VIEW_W), y: rand(-40, -2), vx: rand(-20, 20), vy: rand(30, 70), g: 20, life: rand(2.5, 4), color: pick(cols), confetti: true, phase: Math.random() * 6 });
  }
  updateBossPhase(dt) {
    if (this.paused) return;
    const bp = this.bp, b = this.boss;
    // pending callbacks
    for (let i = this.bPending.length - 1; i >= 0; i--) {
      const p = this.bPending[i]; p.t -= dt;
      if (p.t <= 0) { this.bPending.splice(i, 1); p.fn(); }
    }
    // player move L/R
    if (!bp.ko) {
      let dir = 0;
      const v = this.input.vec;
      if (Math.abs(v.x) > 0.15) dir = Math.sign(v.x);
      // touch half-screen: if joy not active, map left/right halves via last pointer (handled via vec already for joy)
      // also support held left/right keys through vec
      bp.vx = approach(bp.vx, dir * SURVIVE.SPEED, SURVIVE.ACCEL * dt);
      const nx = clamp(bp.x + bp.vx * dt, 18, VIEW_W - 18);
      bp.roll += Math.abs(nx - bp.x); bp.x = nx;
      bp.invuln = Math.max(0, bp.invuln - dt); bp.hurtT = Math.max(0, bp.hurtT - dt);
      bp.recoil = Math.max(0, bp.recoil - dt);
      bp.flash = bp.flash.map((f) => Math.max(0, f - dt));
      bp.blinkIn -= dt;
      if (bp.blinkIn <= 0) { bp.blinkT = 0.12; bp.blinkIn = rand(2, 4.5); }
      bp.blinkT = Math.max(0, bp.blinkT - dt);
      // auto fire
      bp.fireCd -= dt;
      if (bp.fireCd <= 0 && b.state !== 'enter') {
        bp.fireCd = SURVIVE.FIRE;
        const left = bp.barrel === 0; bp.barrel ^= 1;
        const bx = bp.x + (left ? -11.5 : 10.5), by = SURVIVE.BASE_Y - 20;
        this.bShots.push({ x: bx, y: by, vx: 0, vy: -SURVIVE.BULLET, t: 0 });
        bp.flash[left ? 0 : 1] = 0.05; bp.recoil = 0.05;
      }
    }
    // milk shots (move first)

  updateBossEntity(dt) {

  bossPatternB(kind) {

    const SH = this.shotDefs();

    const aimAt = (sp) => {
      const dx = this.bp.x - b.x, dy = SURVIVE.BASE_Y - 12 - b.y - 20, d = Math.hypot(dx, dy) || 1;
      return [(dx / d) * sp, (dy / d) * sp];
    };

    if (kind === 'aimWave') {
      const count = Math.min(5, 2 + Math.floor((n - 1) / 1.5));
      for (let i = 0; i < count; i++) this.laterB(i * 0.38, () => { if (!alive()) return; const [vx, vy] = aimAt(88 * speed); shoot('current', this.boss.x, this.boss.y + 20, vx, vy); });

      if (n >= 3) this.laterB(0.55, () => { if (!alive()) return; for (let i = 0; i < count - 1; i++) { const a = Math.PI / 2 + ((i + 0.5) / (count - 1) - 0.5) * spread; shoot('wave', this.boss.x, this.boss.y + 20, Math.cos(a) * sp, Math.sin(a) * sp); } });

      bubble: { frames: () => [MX.bian], hw: 6, hh: 5, wobble: 10 },
      flyer:  { frames: () => MX.flyer, fdur: 0.14, hw: 3, hh: 3, sway: 22 },

  spawnBMinion(kind) {

      kind, x: fromLeft ? -20 : VIEW_W + 20, y: rand(70, 120),

  updateBMinions(dt) {

    this.clearBEnemyShots(); this.bPending.length = 0;

  // ──────────────────────────── 9. RENDERING ────────────────────────────

    let set;
    if (sq === 'ko') set = MX.player.ko;
    else if (sq === 'caught' || p.sweatT > 0) set = MX.player.sweat[p.moving ? Math.floor(p.anim) % 4 : 1];
    else if (!p.moving && p.blinkT < 0.13) set = MX.player.blink;
    else set = MX.player.walk[p.moving ? Math.floor(p.anim) % 4 : 1];

  chaserSprite(c) {
    const C = MX.chars[c.kind];
    let set;
    if (c.mode === 'stun') set = C.dizzy;
    else if (c.mode === 'argue') set = C.argue[Math.floor(this.time * 3 + c.jit) % 2];
    else if (c.mode === 'chase') set = C.chase[Math.floor(c.anim * 8) % 2];

  drawChaser(ctx, c, ox, oy) {

    const s = this.chaserSprite(c);
    const hop = c.mode === 'chase' ? Math.round(Math.abs(Math.sin(c.anim * 12))) : 0;

  /** ~50% blue veil everywhere, punched out by the torch beam, its glow, street lamps and the door. */

      if (L.on > 0) {
        const gr = g.createRadialGradient(px, py, 2, px, py, L.range);
        gr.addColorStop(0, `rgba(0,0,0,${L.on})`); gr.addColorStop(0.74, `rgba(0,0,0,${L.on})`); gr.addColorStop(1, 'rgba(0,0,0,0)');

  /** Marks / alarms stay fair; speech bubbles and detail rims only when the chaser is (partly) seen. */
  drawOverlays(ctx, ox, oy) {
    const playing = this.state === 'playing';
    for (const c of this.chasers) {
      if (!c.spr || (c.vis || 0) < 0.35) continue;
      // Soft rim only while revealed (boss / chase stand out); no free outline in the dark.
      const col = c.boss ? '#ff5a5a' : c.mode === 'chase' ? '#ff9a8a' : null;
      if (!col) continue;
      ctx.globalAlpha = 0.55 * clamp(c.vis, 0, 1);

      ctx.globalAlpha = 1;

    this.glints.draw(ctx, ox, oy);
    for (const c of this.chasers) {
      if (!c.spr) continue;

  /** Off-screen pointers: red for anyone chasing, pale for wanderers nearby, gold for the 連任 door. */
  drawArrows(ctx) {
    const ox = this.ox, oy = this.oy, px = this.p.x - ox, py = this.p.y - oy;
    const x0 = 10, y0 = HUD_H + 10, x1 = VIEW_W - 10, y1 = VIEW_H - 10;
    const marks = [];
    for (const c of this.chasers) {
      const sx = c.x - ox, sy = c.y - oy;
      if (sx > -4 && sy > HUD_H - 6 && sx < VIEW_W + 4 && sy < VIEW_H + 14) continue;
      const d = Math.hypot(c.x - this.p.x, c.y - this.p.y);
      if (c.mode === 'chase') marks.push({ sx, sy, col: '#ff4a4a', size: 6, label: '！', lc: '#ffffff' });
      else if (d < TILE * 10) marks.push({ sx, sy, col: c.boss ? '#ff9a8a' : '#c8d0f0', size: 4, alpha: 0.7 });
    }
    for (const c of this.currents) {
      if (c.mode !== 'rush' && c.mode !== 'warn') continue;
      const sx = c.x - ox, sy = c.y - oy;

      marks.push({ sx, sy, col: '#4aa3f0', size: 6, label: '洋流', lc: '#7ec8ff', door: true });
    }
    const e = this.exit;
    if (!e.run) {
      const sx = e.x - ox, sy = e.y - oy;
      if (!(sx > 0 && sy > HUD_H && sx < VIEW_W && sy < VIEW_H)) marks.push({ sx, sy, col: '#ffd45e', size: 6, label: '連任', lc: '#ffd45e', door: true });
    }

      let t = Infinity;

        const half = Math.max(...this.toasts.map((q) => zhWidth(q.text, 11, 'bold'))) / 2 + 18;

  requestAnimationFrame(frame);             // schedule first: one bad frame must never stop the game
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  try { game.update(dt); game.render(); }
  catch (err) { if (crashed++ < 3) console.error(err); }
}
requestAnimationFrame(frame);

// Debug / test hooks.
const tc = (tx, ty) => ({ x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2 });
window.wananMaze = {
  game, MX, SPR, TILE, SURVIVE, BOSS_HP, ENDERS, ENDER_NAMES, get VIEW_W() { return VIEW_W; }, get VIEW_H() { return VIEW_H; }, get BASE_VIEW_W() { return BASE_VIEW_W; }, get BASE_VIEW_H() { return BASE_VIEW_H; }, tryEnterFullscreen, isMobileLayout, resize, wantTouchPrompt,
  teleport(tx, ty) { const c = tc(tx, ty); game.p.x = c.x; game.p.y = c.y; game.updateFields(); game.updateCamera(0, true); game.computeLight(); },
  face(dx, dy) { const p = game.p; p.fx = dx; p.fy = dy; p.ang = Math.atan2(dy, dx); if (dx) p.face = dx > 0 ? 1 : -1; game.computeLight(); },
  tileOf(x, y) { return [Math.floor(x / TILE), Math.floor(y / TILE)]; },
  solid(tx, ty) { return game.solidTile(tx, ty); },
  spawnChaser(kind, tx, ty) { const c = game.makeChaser(kind, tx, ty); game.chasers.push(c); return game.chasers.length - 1; },
  clearChasers() { game.chasers = []; },
  give(kind, n) { game.inv[kind] = n; },
  setBattery(v) { game.battery = v; },
  cutTrees(n) { return game.startCut(n); },
  litAt(x, y) { return game.litFactor(x, y); },
  entityVis() { return { chasers: game.chasers.map((c) => ({ kind: c.kind, vis: +(c.vis || 0).toFixed(3), lit: game.litFactor(c.x, c.y - 6) })), items: game.items.map((it) => ({ kind: it.kind, vis: +(it.vis || 0).toFixed(3) })), rats: game.rats.slice(0, 6).map((r) => ({ vis: +(r.vis || 0).toFixed(3) })), currents: game.currents.map((c) => ({ mode: c.mode, vis: +(c.vis || 0).toFixed(3) })) }; },
  spawnCurrent(tx, ty) {
    if (tx != null) return game.spawnCurrent(ty * game.lv.w + tx);
    return game.spawnCurrent();
  },
  faceTree() { return game.faceTree(); },
  ratWave() { game.startRatWave(); },
  /** Jump straight into the Galaga boss fight (after level 3 clear). */
  startBoss(lives) {
    game.paused = false; game.seq = null; game.banner = null;
    if (lives != null) game.lives = lives;
    else if (game.lives <= 0) game.lives = PLAYER.LIVES;
    game.score = Math.max(game.score, 1000);
    game.bossReached = true; game.beginBossTransition();
  },
  /** Fast-forward survival clock almost to the fake-win threshold. */
  almostSurvive(sec) { if (game.state === 'boss') game.surviveT = Math.max(0, (sec != null ? sec : SURVIVE.NEED - 1.2)); },
  forceSurvive() { if (game.state === 'boss') { game.surviveT = SURVIVE.NEED; game.surviveDone = false; game.triggerFakeWin(); } },
  forceCold(who) {
    if (game.state !== 'boss' && game.state !== 'bossWin' && game.state !== 'coldwater') game.startBoss(3);
    game.triggerFakeWin(); game.stateT = 99; game.startColdWater();
    if (who && ENDERS.includes(who)) game.cold.who = who;
  },
  killInBoss() { if (game.state === 'boss') { game.lives = 0; game.bp.ko = true; game.overIn = 0.05; } },
  /** A straight corridor run of `len` open tiles from the player, in any of the 4 directions. */
  corridor(len) {
    const [px, py] = this.tileOf(game.p.x, game.p.y);
    for (const [dx, dy] of DIRS4) { let k = 1; while (k <= len && !game.solidTile(px + dx * k, py + dy * k)) k++; if (k > len) return { dx, dy, tx: px + dx * len, ty: py + dy * len }; }
    return null;
  },
  /** Teleport to a tile `d` steps (BFS) from the 連任 door. */
  nearExit(d) {
    const lv = game.lv, f = bfs(lv, [lv.exit.y * lv.w + lv.exit.x]);
    const i = f.findIndex((v) => v === d);
    if (i >= 0) this.teleport(i % lv.w, (i / lv.w) | 0);
    return i >= 0;
  },
  pathToExit() { const lv = game.lv; return bfs(lv, [lv.exit.y * lv.w + lv.exit.x]); },
  findTile(pred) { const lv = game.lv; for (let y = 0; y < lv.h; y++) for (let x = 0; x < lv.w; x++) if (pred(x, y, lv.t[y * lv.w + x])) return [x, y]; return null; },
};
